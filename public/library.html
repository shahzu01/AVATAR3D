<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Library · Kael Studio</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .view { display: grid; grid-template-columns: 1fr 400px; min-height: 0; height: 100%; }
  .view > aside { border-left: 1px solid var(--line); background: linear-gradient(180deg, #11131c, #0e1017); overflow-y: auto; min-width: 0; }
  .view .stage { min-width: 0; }
  .fill { position: absolute; inset: 0; z-index: 1; }
  .fill canvas { display: block; }
  .fill.checker { background: repeating-conic-gradient(#1d1f2b 0 25%, #171923 0 50%) 0 0/24px 24px; }
  .overlay { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; color: var(--muted); pointer-events: none; text-align: center; padding: 30px; font-size: 14px; }
  /* home: avatar strip, action bar, info panel */
  .strip { top: 14px; left: 14px; bottom: 96px; width: 150px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .strip .hdr { display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 650; }
  #libGrid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px; flex: 1; min-height: 0; }
  #libGrid .card { flex: none; width: 100%; border-radius: 12px; background: linear-gradient(160deg, #20233a, #171926); border: 1px solid var(--line); overflow: hidden; cursor: pointer; position: relative; transition: border-color .15s, transform .15s; }
  #libGrid .card:hover { border-color: #4b4f68; }
  #libGrid .card.sel { box-shadow: 0 0 0 2px var(--acc), 0 8px 20px rgba(155,107,255,.25); border-color: transparent; }
  #libGrid .thumb { aspect-ratio: 1; display: grid; place-items: center; font-size: 34px; color: var(--muted); background: repeating-conic-gradient(#1c1e2a 0 25%, #191b26 0 50%) 0 0/16px 16px; }
  #libGrid .thumb img { width: 100%; height: 100%; object-fit: cover; }
  #libGrid .body { padding: 6px 8px 8px; }
  #libGrid .name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #libGrid .sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #libGrid .live { position: absolute; top: 6px; left: 6px; font-size: 9.5px; font-weight: 750; letter-spacing: .6px; padding: 2px 6px; border-radius: 99px; background: var(--grad); color: #fff; }
  .actions-bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px; }
  .actions-bar a, .actions-bar button { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-weight: 650; font-size: 13.5px; text-decoration: none; }
  .actions-bar svg { width: 18px; height: 18px; }
  #createCard { background: var(--grad); color: #fff; box-shadow: 0 6px 18px rgba(155,107,255,.3); }
  #createCard:hover { filter: brightness(1.08); }
  #importCard { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--text); }
  .info { padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .info h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .1px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .fact small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; }
  .fact span { font-size: 13px; font-weight: 600; }
  .info .btns { display: grid; gap: 8px; }
  .info .btns button, .info .btns a { padding: 10px; text-align: center; justify-content: center; }
  .info .tip { color: var(--muted); font-size: 12px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; }
  #libEmpty { text-align: center; padding: 14px; }
  /* detail + import */
  .namebar { top: 14px; left: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 28px); }
  .namebar h2 { margin: 0; font-size: 16px; }
  .vrow { left: 14px; right: 14px; bottom: 14px; padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; }
  .vrow .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .vrow .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; width: 86px; flex: none; }
  .vrow .pills { max-height: 58px; overflow-y: auto; flex: 1; }
  .vrow select { padding: 4px 24px 4px 8px; font-size: 12px; }
  .vrow label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .side { padding: 18px 20px 26px; }
  .side .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .side .actions .wide { grid-column: 1 / -1; padding: 10px; }
  .side .actions button, .side .actions a { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tabs { display: flex; gap: 2px; padding: 3px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 8px; font-size: 12.5px; font-weight: 600; border-radius: 8px; }
  .tabs button.on { background: var(--surface3); color: #fff; box-shadow: inset 0 0 0 1px var(--line2); }
  table.kv { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.kv td { padding: 6px 4px; border-bottom: 1px solid #1f2230; vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 44%; }
  .yes { color: var(--ok); } .no { color: var(--bad); } .part { color: var(--warn); }
  .issues { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .issues li { padding: 8px 10px; border-radius: 9px; background: var(--surface2); font-size: 12.5px; border-left: 3px solid var(--muted); }
  .issues li.error { border-left-color: var(--bad); } .issues li.warn { border-left-color: var(--warn); } .issues li.ok { border-left-color: var(--ok); }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .row label, label.inline { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .row input[type=range] { width: 120px; }
  h2.sec { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin: 18px 0 8px; font-weight: 650; }
  .drop { border: 2px dashed var(--line2); border-radius: 14px; padding: 34px 18px; text-align: center; color: var(--muted); background: rgba(155,107,255,.03); }
  .drop.over { border-color: var(--acc); background: rgba(155,107,255,.08); }
  .drop .big { width: 46px; height: 46px; margin: 0 auto 8px; border-radius: 14px; background: var(--acc-soft); display: grid; place-items: center; color: #d2b8ff; }
  .drop .big svg { width: 24px; height: 24px; }
  .progress { height: 6px; background: var(--surface3); border-radius: 99px; overflow: hidden; margin: 10px 0; }
  .progress > div { height: 100%; width: 0; background: var(--grad); transition: width .15s; }
  .fileinfo { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; margin: 6px 0 4px; }
  .fileinfo span:nth-child(odd) { color: var(--muted); }
  iframe.stream { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 10px; background: repeating-conic-gradient(#1d1f2b 0 25%, #171923 0 50%) 0 0/20px 20px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
  @media (max-width: 1100px) { .view { grid-template-columns: 1fr 340px; } }
  @media (max-width: 820px) { .view { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } .view > aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.js" } }
</script>
</head>
<body>
<div class="app">
  <header id="topbar"></header>
  <div style="min-height:0">
    <!-- ======================= home: stage ======================= -->
    <section id="vLibrary" class="view">
      <main class="stage">
        <div class="fill" id="homeViewer"></div>
        <div class="overlay" id="homeOverlay"></div>
        <div class="floating glass strip">
          <div class="hdr">My avatars <span class="faint" id="libCount"></span></div>
          <div id="libGrid"></div>
          <p class="muted" id="libEmpty" style="display:none">No avatars yet. Create one or import a VRM.</p>
        </div>
        <div class="floating glass actions-bar">
          <a id="createCard" href="/creator.html"><span data-icon="creator"></span>Create a New Avatar</a>
          <button id="importCard"><span data-icon="import"></span>Import My 3D Avatar</button>
        </div>
      </main>
      <aside><div class="info" id="homeInfo"></div></aside>
    </section>

    <!-- ======================= import ======================= -->
    <section id="vImport" class="view hidden">
      <main class="stage">
        <div class="fill" id="impViewer"></div>
        <div class="overlay" id="impOverlay">Choose a file to preview it here.</div>
        <div class="floating glass vrow" id="impViewRow"></div>
      </main>
      <aside class="side">
        <h2 id="impTitle" style="margin:0 0 12px;font-size:18px">Import my 3D avatar</h2>
        <div class="drop" id="drop">
          <div class="big" data-icon="import"></div>
          <p style="margin:6px 0 12px">Drag a <b style="color:var(--text)">.vrm</b> file here, or</p>
          <button class="primary" id="pick">Choose file…</button>
          <input type="file" id="file" accept=".vrm,.glb" class="hidden">
          <p class="muted" id="limitNote" style="margin-top:12px"></p>
        </div>
        <div id="impInfo" class="hidden">
          <div class="fileinfo" id="fileinfo"></div>
          <div class="progress"><div id="bar"></div></div>
          <div class="status" id="impStatus"></div>
          <div id="impReport"></div>
          <div id="impSave" class="hidden">
            <div class="row"><input type="text" id="impName" maxlength="60" placeholder="Name" style="flex:1"></div>
            <div class="row"><label class="inline"><input type="checkbox" id="impActive"> Use as my active avatar after saving</label></div>
            <div class="row"><button class="primary" id="impSaveBtn" style="flex:1;padding:10px">Save to library</button><button id="impCancel">Cancel</button></div>
          </div>
          <div class="row" id="impRetry"><button id="impAgain" class="hidden">Choose another file</button></div>
        </div>
      </aside>
    </section>

    <!-- ======================= avatar detail ======================= -->
    <section id="vDetail" class="view hidden">
      <main class="stage">
        <div class="fill" id="dViewer"></div>
        <div class="overlay" id="dOverlay">Loading…</div>
        <div class="floating glass namebar"><button class="ghost iconbtn" id="dBack" title="Back to the library">←</button><h2 id="dName"></h2><span class="badges" id="dBadges"></span></div>
        <div class="floating glass vrow" id="dViewRow"></div>
      </main>
      <aside class="side">
        <div class="actions">
          <button class="primary wide" id="dActivate">Set as active avatar</button>
          <a class="btnlink hidden wide" id="dEdit" href="#"><span data-icon="edit"></span>Edit in creator</a>
          <button id="dRename"><span data-icon="edit"></span>Rename</button>
          <button id="dDuplicate"><span data-icon="copy"></span>Duplicate settings</button>
          <a class="btnlink" id="dDownload" href="#" style="justify-content:center"><span data-icon="download"></span>Download original</a>
          <button id="dReplace"><span data-icon="import"></span>Replace file…</button>
          <button class="danger wide" id="dDelete"><span data-icon="trash"></span>Delete</button>
          <input type="file" id="replaceFile" accept=".vrm,.glb" class="hidden">
        </div>
        <div class="status" id="dStatus"></div>
        <div class="tabs" id="dTabs">
          <button data-tab="caps" class="on">Capabilities</button><button data-tab="present">Stream setup</button><button data-tab="file">File &amp; licence</button>
        </div>
        <div id="tab-caps"></div>
        <div id="tab-present" class="hidden"></div>
        <div id="tab-file" class="hidden"></div>
      </aside>
    </section>
  </div>
</div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <input type="text" id="mInput" class="hidden" maxlength="60" style="width:100%;margin-bottom:14px">
  <div class="actions"><button id="mCancel">Cancel</button><button class="primary" id="mOk">OK</button></div>
</div></div>
<script type="module" src="/library.js"></script>
</body>
</html>
