<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Creator · Kael Studio</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .work { display: grid; grid-template-columns: var(--rail) var(--panelW, 384px) 1fr; min-height: 0; transition: grid-template-columns .25s ease; }
  body.panel-closed .work { --panelW: 0px; }
  body.panel-closed #editor { opacity: 0; pointer-events: none; }
  #editor { min-width: 0; overflow: hidden; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: linear-gradient(180deg, #11131c, #0e1017); transition: opacity .2s; }
  #editor .panel-h { padding: 16px 18px 6px; }
  #editor .panel-h .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #subtabsWrap { padding: 6px 18px 4px; }
  #tabBody { flex: 1; overflow-y: auto; padding: 8px 18px 22px; }
  .stage { min-width: 0; }
  #viewer { position: absolute; inset: 0; z-index: 1; }
  #viewer canvas { display: block; }
  #viewer.checker { background: repeating-conic-gradient(#1d1f2b 0 25%, #171923 0 50%) 0 0/24px 24px; }
  .views { top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
  .views select { background-color: transparent; border: 0; color: var(--muted); padding: 6px 24px 6px 8px; font-size: 12.5px; }
  .busy { top: 66px; left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); padding: 4px 12px; opacity: 0; transition: opacity .2s; }
  .busy.on { opacity: 1; }
  .saved { top: 14px; left: 14px; display: flex; align-items: center; gap: 6px; padding: 6px; }
  .saved .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 0 6px 0 4px; writing-mode: vertical-rl; transform: rotate(180deg); }
  .saved a, .saved button { width: 44px; height: 44px; border-radius: 11px; overflow: hidden; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line2); padding: 0; }
  .saved a img { width: 100%; height: 100%; object-fit: cover; }
  .saved a.cur { box-shadow: 0 0 0 2px var(--acc); border-color: transparent; }
  .saved a:hover { border-color: #4b4f68; }
  .dock-test { left: 14px; bottom: 14px; max-width: min(560px, calc(100% - 420px)); padding: 10px 12px; }
  .dock-test .row { display: flex; gap: 8px; align-items: flex-start; }
  .dock-test .row + .row { margin-top: 7px; }
  .dock-test .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; width: 52px; flex: none; padding-top: 5px; }
  .dock-test.collapsed .row { display: none; }
  .dock-test .hdr { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; margin-bottom: 7px; }
  .dock-test.collapsed .hdr { margin: 0; }
  .dock-test .hdr button { margin-left: auto; padding: 2px 8px; font-size: 11px; }
  .dock-save { right: 14px; bottom: 14px; padding: 12px; width: 330px; display: flex; flex-direction: column; gap: 8px; }
  .dock-save .r { display: flex; gap: 8px; align-items: center; }
  .dock-save input[type=text] { flex: 1; min-width: 0; }
  .dock-save .primary { padding: 9px 16px; }
  .dock-save label { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .equip { top: 14px; right: 14px; width: 214px; padding: 10px; max-height: calc(100% - 210px); overflow-y: auto; }
  .equip h3 { margin: 2px 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: flex; align-items: center; }
  .equip h3 button { margin-left: auto; padding: 0 6px; font-size: 14px; line-height: 20px; }
  .equip .it { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 5px; border: 1px solid transparent; background: transparent; border-radius: 10px; }
  .equip .it:hover { background: rgba(255,255,255,.05); border-color: var(--line2); }
  .equip .it .ic { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(160deg, #262a45, #1a1c2b); overflow: hidden; flex: none; display: grid; place-items: center; font-size: 16px; }
  .equip .it .ic img { width: 100%; height: 100%; object-fit: cover; }
  .equip .it small { display: block; color: var(--muted); font-size: 10.5px; line-height: 1.1; }
  .equip .it span { font-size: 12.5px; }
  body.equip-closed .equip { display: none; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .rnd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 2px; }
  .rnd button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px; }
  .acc-tile { cursor: pointer; }
  .acc-tile input { position: absolute; top: 6px; left: 6px; z-index: 2; margin: 0; }
  .acc-colors { display: grid; gap: 8px; margin-top: 4px; }
  .acc-colors .ac { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; line-height: 1.5; }
  @media (max-width: 1180px) { .equip { display: none; } .dock-test { max-width: calc(100% - 380px); } }
  @media (max-width: 900px) { .work { --panelW: 320px; } .dock-save { width: 260px; } .dock-test { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.js" } }
</script>
</head>
<body>
<div class="app">
  <header id="topbar"></header>
  <div class="work">
    <nav class="rail" id="tabs"></nav>
    <aside id="editor">
      <div class="panel-h"><div><h2 id="catTitle">Start</h2><div class="sub" id="catSub"></div></div></div>
      <div id="subtabsWrap"><div class="subtabs" id="subtabs"></div></div>
      <div id="tabBody"></div>
    </aside>
    <main class="stage" id="stage">
      <div id="viewer"></div>
      <div class="floating glass seg views">
        <button data-view="front-full" title="Full body">Full</button>
        <button data-view="front" class="on" title="Upper body">Upper</button>
        <button data-view="face" title="Face close-up">Face</button>
        <span class="div"></span>
        <button data-view="threequarter" title="Three-quarter view">¾</button>
        <button data-view="side" title="Side view">Side</button>
        <button data-view="back" title="Back view">Back</button>
        <span class="div"></span>
        <button data-zoom="0.8" title="Zoom in">＋</button><button data-zoom="1.25" title="Zoom out">－</button>
        <span class="div"></span>
        <select id="bg" title="Preview background"><option value="stage">Stage</option><option value="dark">Dark</option><option value="light">Light</option><option value="green">Green</option><option value="transparent">Checker</option></select>
      </div>
      <div class="floating glass busy" id="busy">updating…</div>
      <div class="floating glass saved" id="savedStrip"></div>
      <div class="floating glass equip" id="equipped"></div>
      <div class="floating glass dock-test" id="testDock">
        <div class="hdr"><span>Try it</span><span class="muted">motions and expressions on the preview</span><button id="testToggle">Hide</button></div>
        <div class="row"><span class="k">Motion</span><span class="pills small" id="motions"></span></div>
        <div class="row"><span class="k">Face</span><span class="pills small" id="testExpr"></span></div>
      </div>
      <div class="floating glass dock-save">
        <div class="r"><input type="text" id="name" maxlength="60" placeholder="Character name"></div>
        <div class="r"><label><input type="checkbox" id="makeActive"> Use as my active avatar</label></div>
        <div class="r"><button class="primary" id="save" style="flex:1">Save to library</button><button id="saveCopy" class="hidden">Save copy</button></div>
        <div class="status" id="status"></div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="/creator.js"></script>
</body>
</html>
